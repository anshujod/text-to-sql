services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-t2sql}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-app_owner_pw}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:-app_readonly_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - t2sql_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  t2sql_pgdata:
    name: t2sql_pgdata
