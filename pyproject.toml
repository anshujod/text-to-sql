[project]
name = "t2sql"
version = "0.1.0"
description = "Text-to-SQL with a clarification engine"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "numpy>=1.26",
    "faker>=24.0",
    "pydantic>=2.6",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "sentence-transformers>=6.0.0",
    "openai>=3.3.1",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sql"]
